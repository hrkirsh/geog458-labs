<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>My First Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        /* Layout of the legend panel. */
        #legend {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 110px;
            background: #fff;
            margin-right: 20px;
            margin-bottom: 40px;
            padding: 10px 20px 10px 10px;
            border-radius: 3px;
            text-align: center;
        }

        /* Each row for a magnitude value. */
        .break {
            position: relative;
            margin: 0;
            padding: 0;
        }

        /* The circular symbol. */
        .dot {
            display: inline-block;
            margin-top: 5px;
            border-radius: 50%;
            opacity: 0.6;
        }

        /* Label next to the symbol. */
        .dot-label {
            position: absolute;
            top: 0;
            right: 0;
            font-style: italic;
        }

        /* Link color within the legend. */
        #legend a {
            color: black;
        }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="legend"></div>
    <script>    
        // Anchor the legend to the HTML element with id="legend".
        const legend = document.getElementById('legend');
        const grades = [2, 4.5, 8.5];
        const radii = [4, 9, 17];
        const colors = ['#fdd49e', '#d7301f', '#7f0000'];
        const labels = ['<strong>Population</strong>'];

        for (let i = 0; i < grades.length; i++) {
            const value = grades[i];
            const diameter = 2 * radii[i];

            labels.push(
                '<p class="break"><i class="dot" style="background:' + colors[i] +
                '; width:' + diameter + 'px; height:' + diameter +
                'px;"></i> <span class="dot-label" style="top:' +
                diameter / 2 + 'px;">' + value + '</span></p>'
            );
        }

        const source =
            '<p style="text-align:right; font-size:10pt;">Source: ' +
            '<a href="https://www.naturalearthdata.com/downloads/10m-cultural-vectors/10m-populated-places/">NaturalEarth</a></p>';

        legend.innerHTML = labels.join('') + source;

    </script>
    
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiaHJraXJzaCIsImEiOiJjbWg1OTJ3NnIwM2p3MmxvZThnNGp6b3htIn0.mZMPWlVv49G_2YIZjqy6hA';
        const mymap = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/light-v11',
            projection: 'globe',
            center: [-96, 37.8],
            zoom: 2
        });
        
        mymap.on('style.load', () => {
            mymap.setFog({});
        });

        mymap.on('load', () => {
            mymap.addSource('population', {
                type: 'geojson',
                data: 'data/world-cities.geojson'
            });

            mymap.addLayer({
                id: 'population-layer',
                type: 'circle',
                source: 'population',
                paint: {
                    'circle-radius': [
                    'interpolate', ['linear'],
                    ['sqrt', ['to-number', ['get', 'population'], 0]],
                    1.4, 4,
                    2.1, 9,
                    2.9, 17 ], 
                    'circle-stroke-width': 1,
                    'circle-color': [
                        'interpolate', ['linear'],
                        ['to-number', ['get', 'population'], 0],
                        1,    '#fff7ec',
                        1.5,  '#fee8c8',
                        2,    '#fdd49e',
                        2.5,  '#fdbb84',
                        3,    '#fc8d59',
                        3.5,  '#ef6548',
                        4.5,  '#d7301f',
                        6.5,  '#b30000',
                        8.5,  '#7f0000',
                        10.5, '#000000'
                    ],
                    'circle-stroke-color': 'white'
                }
                
            });


            // Click an earthquake circle to view its magnitude.
            mymap.on('click', 'population-layer', (event) => {
                const feature = event.features[0];
                const coordinates = feature.geometry.coordinates.slice(0, 2);

                new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(`<strong>City:</strong> ${feature.properties.city}
                    <strong> Population:</strong> ${feature.properties.population}`)
                    .addTo(mymap);
            });
            });    
    </script>
</body>
</html>
